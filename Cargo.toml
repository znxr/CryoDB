[package]
name = "cryodb"
version = "0.4.0"
authors = ["Mauricio Orquin <znxr.dev>"]
edition = "2024"
publish = false
description = "Desktop SQL client for MySQL, MariaDB, PostgreSQL and SQLite"
homepage = "https://cryodb.znxr.dev"
repository = "https://github.com/znxr/cryodb"
license = "MIT"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
csv = "1.3"
glob = "0.3"
iced = { version = "0.14.0", default-features = false, features = ["highlighter", "tokio", "advanced", "canvas"] }
iced-code-editor = "0.5.2"
iced_term = "0.7.0"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1.48.0", features = ["fs", "process"] }
rpassword = "7.3"
rfd = "0.16.0"
rustyline = "14.0.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-native-tls", "mysql", "sqlite", "postgres", "chrono", "bigdecimal"] }
catppuccin = "2.6.0"
fontdb = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "=0.26.3"
crossterm = { version = "=0.27.0", features = ["event-stream"] }
tui-textarea = { version = "0.4", features = ["crossterm"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2.5"
wgpu = { version = "27.0.1", default-features = false, optional = true, features = ["std", "wgsl", "parking_lot"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
keyring = "3.6.3"
tempfile = "3.14.0"
rust_xlsxwriter = "0.92.2"
owo-colors = "4.2"
ed25519-dalek = "2.2"
sha2 = "0.10"
hex = "0.4"
semver = "1.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }

[features]
default = ["renderer-wgpu-wayland-vulkan"]
renderer-tiny-skia = ["iced/tiny-skia", "iced/x11", "iced/wayland"]
renderer-wgpu = ["renderer-wgpu-wayland-vulkan"]
renderer-wgpu-wayland = ["iced/wgpu-bare", "iced/wayland", "dep:wgpu", "wgpu/vulkan", "wgpu/gles"]
renderer-wgpu-wayland-vulkan = ["iced/wgpu-bare", "iced/wayland", "dep:wgpu", "wgpu/vulkan"]
renderer-wgpu-wayland-gles = ["iced/wgpu-bare", "iced/wayland", "dep:wgpu", "wgpu/gles"]
renderer-wgpu-x11 = ["iced/wgpu-bare", "iced/x11", "dep:wgpu", "wgpu/vulkan", "wgpu/gles"]
renderer-wgpu-dual = ["iced/wgpu-bare", "iced/x11", "iced/wayland", "dep:wgpu", "wgpu/vulkan", "wgpu/gles"]
renderer-wgpu-windows = ["renderer-wgpu-windows-dx12"]
renderer-wgpu-windows-dx12 = ["iced/wgpu-bare", "dep:wgpu", "wgpu/dx12"]
renderer-wgpu-windows-dx12-gles = ["iced/wgpu-bare", "dep:wgpu", "wgpu/dx12", "wgpu/gles"]
renderer-wgpu-macos = ["renderer-wgpu-macos-metal"]
renderer-wgpu-macos-metal = ["iced/wgpu-bare", "dep:wgpu", "wgpu/metal"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
